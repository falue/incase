<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>incase</title>
  </head>
  <body>
    <header id="topbar">
      <span class="brand">incase</span>
      <div class="bar">
        <div class="seg" id="layout"></div>
        <span class="spacer"></span>
        <button id="save" data-tip="Download the project as a JSON file">Save</button>
        <button id="load" data-tip="Open a project JSON file (replaces the current project; undo brings it back)">Load</button>
        <button id="export-svg" class="primary" data-tip="Download all layers side by side as one SVG in mm, ready for the laser">Export SVG</button>
        <div class="seg" id="units"></div>
        <button id="theme" class="icon" data-tip="Switch between dark and light mode">◐</button>
      </div>
    </header>

    <main id="viewports">
      <div class="pane" id="pane2d">
        <div id="view2d" class="view"></div>
        <div class="overlay top-left"><span class="tag">Top</span>
          <label class="check" data-tip="Snap positions to a 5 mm (⅛ in) grid and rotation to 15°; arrow keys move one step"><input type="checkbox" id="snap" /> Snap</label>
          <label class="check" data-tip="Moves that would push an object out of the case or deeper into a safe zone are refused"><input type="checkbox" id="constrain" /> Keep clear</label>
          <!-- the label changes width, so it comes last and nothing else moves -->
          <span class="stepper" data-tip="Layer whose cut lines are shown; the layers above and below appear faint">
            <button id="layer-up" class="icon" data-tip="Layer above (PageUp)">▲</button><button id="layer-down" class="icon" data-tip="Layer below (PageDown)">▼</button><span id="layer-label"></span>
          </span>
        </div>
      </div>
      <div class="splitter" id="splitter" data-tip="Drag to resize the views · double-click to reset"></div>
      <div class="pane" id="pane3d">
        <div id="view3d" class="view"></div>
        <div class="overlay top-left"><span class="tag">3D</span></div>
        <div class="overlay top-right"><div class="seg" id="camera"></div></div>
        <div class="overlay bottom-left sections">
          <label for="explode" class="wide" data-tip="Lift the layers apart; objects move with the layer their top sits in">Explode</label><input id="explode" data-tip="Lift the layers apart · double-click to reset" type="range" min="0" max="40" value="0" />
          <span data-tip="Show only a slice of the case left to right">X</span><button id="reset-x" class="icon" data-tip="Show the whole width again">↺</button>
          <span class="dual" id="section-x" data-tip="Drag the handles to cut the 3D view left / right · double-click to reset"><input type="range" min="0" max="1000" value="0" /><input type="range" min="0" max="1000" value="1000" /></span>
          <span data-tip="Show only a slice of the case front to back">Y</span><button id="reset-y" class="icon" data-tip="Show the whole depth again">↺</button>
          <span class="dual" id="section-y" data-tip="Drag the handles to cut the 3D view front / back · double-click to reset"><input type="range" min="0" max="1000" value="0" /><input type="range" min="0" max="1000" value="1000" /></span>
        </div>
      </div>
    </main>

    <aside id="global">
      <details open><summary>Case</summary><div id="case" class="props"></div></details>
      <details open><summary>Materials <small>order = preference</small></summary><div id="materials"></div></details>
      <details open><summary>Stack <small>top → bottom</small></summary><div id="stack"></div></details>
      <footer class="links">
        <a href="https://github.com/falue/incase" target="_blank" rel="noopener" data-tip="Source code on GitHub"><svg viewBox="0 0 16 16" aria-label="GitHub"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
        <a href="https://telefabi.ch" target="_blank" rel="noopener">telefabi.ch</a>
      </footer>
    </aside>

    <nav id="toolbar"></nav>

    <aside id="objects">
      <details open><summary>Objects</summary><div id="items" class="outliner"></div></details>
      <details open id="selection-section"><summary>Selected</summary><div id="selection"></div></details>
    </aside>

    <footer id="statusbar"><span id="hint"></span><span id="warnings"></span></footer>

    <div id="busy" hidden>
      <div class="busy-box"><div class="spinner"></div><span id="busy-text"></span><button id="busy-abort" data-tip="Stop and keep the old arrangement (Esc)">Abort</button></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
